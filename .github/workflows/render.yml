name: Render examples

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Style to include in the speed-train smoke run"
        required: true
        default: kinetic_typography
        type: choice
        options:
          - classic
          - glassmorphism
          - neon_glow
          - glitch
          - halftone_dots
          - dithering
          - risograph_print
          - pixel_art
          - ascii_art
          - vaporwave_grid
          - topographic_lines
          - flow_fields
          - particle_swarm
          - metaballs
          - liquid_morph
          - holographic_foil
          - kinetic_typography
          - bauhaus_shapes
          - paper_cutout
          - clay_3d
          - ray_marched_fractals
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Start elapsed-time measurement
        run: echo "job_start=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install package and test dependencies
        id: install
        run: |
          started=$(date +%s)
          python -m pip install ".[dev]"
          echo "seconds=$(($(date +%s)-started))" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: pytest -q

      - name: Render and report timings
        id: render
        env:
          REQUESTED_STYLE: ${{ inputs.style || 'kinetic_typography' }}
        run: |
          set -euo pipefail
          started=$(date +%s)
          mkdir -p out
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            inputs=(examples/di_average.json examples/percent_increase.json examples/speed_train.json examples/time_work.json)
            styles=(classic)
          else
            inputs=(examples/speed_train.json)
            candidates=("$REQUESTED_STYLE" classic glassmorphism bauhaus_shapes)
            styles=()
            for candidate in "${candidates[@]}"; do
              if [[ ! " ${styles[*]} " =~ " ${candidate} " ]]; then
                styles+=("$candidate")
              fi
              [[ ${#styles[@]} -ge 3 ]] && break
            done
          fi
          for input in "${inputs[@]}"; do
            name=$(basename "$input" .json)
            for style in "${styles[@]}"; do
              output="out/$name-$style.mp4"
              solution-video render --input "$input" --out "$output" --style "$style" --no-voice
              python - "$output" <<'PY'
          import json, sys
          from pathlib import Path
          meta = Path(sys.argv[1]).with_suffix(".meta.json")
          data = json.loads(meta.read_text(encoding="utf-8"))
          if data.get("answer_verified") is not True:
              raise SystemExit(f"accuracy metadata failed: {meta}")
          PY
            done
          done
          finished=$(date +%s)
          echo "seconds=$((finished-started))" >> "$GITHUB_OUTPUT"
          {
            echo "## Render job timing"
            echo
            echo "- Package install: ${{ steps.install.outputs.seconds }} seconds"
            echo "- Render/test step: $((finished-started)) seconds"
            echo "- Measured job elapsed: $((finished-${job_start:-finished})) seconds (timer starts after checkout/setup-python)"
            echo "- Styles: ${styles[*]}"
            echo
            echo "| Artifact | Size (bytes) |"
            echo "|---|---:|"
            for video in out/*.mp4; do
              [[ -e "$video" ]] || continue
              echo "| $(basename "$video") | $(stat -c%s "$video") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rendered videos
        uses: actions/upload-artifact@v7
        with:
          name: solution-videos
          path: |
            out/*.mp4
            out/*.meta.json
          if-no-files-found: error
