[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solution-video"
version = "0.1.0"
description = "JSON-driven solution video generator (Tanglish voice-over) for aptitude content"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["Pillow>=10.4,<12", "numpy>=1.26,<3", "pydantic>=2.8,<3", "requests>=2.32,<3"]

[project.optional-dependencies]
voice = ["edge-tts>=6.1,<8", "gradio_client>=1.0,<3"]
dev = ["pytest>=8,<9"]

[project.scripts]
solution-video = "solution_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solution_video.voice" = ["normalization.json"]

[tool.setuptools.data-files]
themes = ["themes/*.json"]
fonts = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
